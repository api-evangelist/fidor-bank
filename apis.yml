name: Fidor Bank
description: >-
  Fidor Bank was a German digital challenger bank founded in Munich in 2009 and an
  early pioneer of Banking-as-a-Service and open banking through its fidorOS /
  bankOS middleware platform and public REST API, which covered Customers,
  Accounts, Transfers, Transactions and Account Information over an OAuth2
  authorization-code flow. Fidor was acquired by France's Groupe BPCE in 2016;
  following years of post-acquisition integration struggles the bank ceased
  business operations in mid-2023 and entered liquidation. Its developer portal
  (fidor.com) is now a parked domain and the sandbox and production API hosts are
  offline. The surviving first-party developer artifacts are the archived official
  Ruby client (RubyGems: fidor_api, by Fidor Solutions AG) and the github.com/fidor
  organization. This is a retired provider retained for historical reference.
